<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Гра: Будова і функції клітини</title>
<style>
:root{
  --kimi-font-sans: system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --kimi-color-text-primary:#1a1a1a;
  --kimi-color-text-secondary:#4b4b4b;
  --kimi-color-text-tertiary:#8a8a8a;
  --kimi-color-text-quaternary:#b0b0b0;
  --kimi-color-surface:#ffffff;
  --kimi-color-surface-muted:#f2f2f2;
  --kimi-color-surface-raised:#ffffff;
  --kimi-color-border:#dcdcdc;
  --kimi-color-danger:#e5484d;
  --kimi-color-positive:#30a46c;
  --kimi-color-warning:#f5a524;
  --kimi-color-accent:#3b82f6;
  --kimi-chart-1:#3b82f6;
  --kimi-chart-2:#ef4444;
  --kimi-chart-3:#22a356;
  --kimi-chart-4:#8b5cf6;
  --kimi-chart-5:#9ca3af;
  --t-micro:60ms; --t-fast:120ms; --t-normal:200ms; --t-slow:300ms;
  --ease-out:cubic-bezier(.22,1,.36,1); --ease-in:cubic-bezier(.55,0,.55,.2); --ease-standard:cubic-bezier(.4,0,.2,1);
}
body{background:#fafafa;padding:16px;font-family:var(--kimi-font-sans);color:var(--kimi-color-text-primary);margin:0}
button,input,select,textarea{font:inherit}
</style>
</head>
<body>
<div id="cellgame" style="font-family: var(--kimi-font-sans); color: var(--kimi-color-text-primary); max-width:1000px;margin:0 auto;">
  <style>
    #cellgame .hdr{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
    #cellgame h3{margin:0;font-size:17px;font-weight:500;line-height:1.3}
    #cellgame .sub{font-size:13px;color:var(--kimi-color-text-tertiary);margin:2px 0 0}
    #cellgame .score{margin-left:auto;font-size:14px;font-weight:500;font-variant-numeric:tabular-nums}
    #cellgame .pbar{width:120px;height:6px;border-radius:4px;background:var(--kimi-color-surface-muted);overflow:hidden}
    #cellgame .pfill{height:100%;width:0%;background:var(--kimi-color-text-primary);transition:width var(--t-normal) var(--ease-out)}
    #cellgame .btn{border:1px solid var(--kimi-color-border);background:var(--kimi-color-surface);color:var(--kimi-color-text-primary);border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer;transition:background var(--t-fast)}
    #cellgame .btn:hover{background:var(--kimi-color-surface-muted)}
    #cellgame .board{display:grid;grid-template-columns:150px repeat(3,1fr);gap:8px;align-items:start}
    #cellgame .parts{display:flex;flex-direction:column;gap:6px}
    #cellgame .sec-h{font-size:12px;font-weight:500;color:var(--kimi-color-text-secondary);padding:8px 8px 4px;border-bottom:1px solid var(--kimi-color-border);margin-bottom:8px;position:sticky;top:0;background:transparent}
    #cellgame .col{display:flex;flex-direction:column;gap:6px}
    #cellgame .chip{padding:7px 10px;border:1px solid var(--kimi-color-border);border-radius:10px;background:var(--kimi-color-surface);font-size:12.5px;font-weight:500;cursor:grab;user-select:none;transition:border-color var(--t-fast),box-shadow var(--t-fast)}
    #cellgame .chip:hover{border-color:var(--kimi-color-text-primary)}
    #cellgame .chip.sel{border-color:var(--kimi-color-text-primary);box-shadow:0 0 0 2px var(--kimi-color-surface),0 0 0 3px var(--kimi-color-text-primary)}
    #cellgame .chip.ghost{opacity:.35}
    #cellgame .blk{border:1px solid var(--kimi-color-border);border-radius:10px;padding:8px;background:var(--kimi-color-surface);transition:border-color var(--t-fast)}
    #cellgame .blk.over{border-color:var(--kimi-color-text-primary)}
    #cellgame .blk.done{border-color:var(--kimi-color-positive);background:color-mix(in srgb, var(--kimi-color-positive) 8%, transparent)}
    #cellgame .slot{display:flex;align-items:center;gap:6px;min-height:26px;border:1px dashed var(--kimi-color-border);border-radius:6px;padding:3px 8px;font-size:12px;color:var(--kimi-color-text-quaternary);margin-bottom:6px;transition:border-color var(--t-fast),color var(--t-fast)}
    #cellgame .blk.over .slot{border-color:var(--kimi-color-text-primary);color:var(--kimi-color-text-primary)}
    #cellgame .blk.done .slot{border-style:solid;border-color:var(--kimi-color-positive);color:var(--kimi-color-text-primary);font-weight:500;background:color-mix(in srgb, var(--kimi-color-positive) 14%, transparent)}
    #cellgame .txt{font-size:12px;line-height:1.45;color:var(--kimi-color-text-secondary)}
    #cellgame .imgw{display:flex;justify-content:center;padding:4px 0 2px}
    @keyframes cgshake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
    #cellgame .shake{animation:cgshake .18s var(--ease-standard) 2;border-color:var(--kimi-color-danger)!important}
    #cellgame .win{display:none;margin-top:12px;padding:10px 12px;border-radius:10px;font-size:14px;font-weight:500;border:1px solid var(--kimi-color-positive);background:color-mix(in srgb, var(--kimi-color-positive) 10%, transparent)}
    #cellgame .win.show{display:block}
    @media(max-width:680px){#cellgame .board{grid-template-columns:120px repeat(3,1fr)}#cellgame .txt{font-size:11px}}
  </style>

  <div class="hdr">
    <div>
      <h3>Будова і функції клітини</h3>
      <p class="sub">Перетягни назву органели до її функції, будови та зображення (або клацни назву, потім — блок).</p>
    </div>
    <div class="score" id="cgScore">0 / 18</div>
    <div class="pbar"><div class="pfill" id="cgFill"></div></div>
    <button class="btn" id="cgReset">Скинути</button>
  </div>

  <div class="board" id="cgBoard"></div>
  <div class="win" id="cgWin">Вітаємо! Усі 18 елементів клітини правильно поєднано з їх функціями, будовою та зображеннями.</div>

    matched=0,selChip=null;
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function icon(id){return '<svg width="40" height="28" viewBox="0 0 40 28">'+ICONS[id]+'</svg>'}
function build(){
 matched=0;selChip=null;winEl.className='win';scoreEl.textContent='0 / '+ORG.length;fill.style.width='0%';
 board.innerHTML='';
 var parts=document.createElement('div');parts.className='parts';
 parts.innerHTML='<div class="sec-h">Назви</div>';
 shuffle(ORG.slice()).forEach(function(o){
   var c=document.createElement('div');c.className='chip';c.textContent=o.name;c.dataset.org=o.id;c.draggable=true;
   c.addEventListener('dragstart',function(e){e.dataTransfer.setData('text/plain',o.id);c.classList.add('ghost')});
   c.addEventListener('dragend',function(){c.classList.remove('ghost')});
   c.addEventListener('click',function(){
     if(c.classList.contains('sel')){c.classList.remove('sel');selChip=null}
     else{document.querySelectorAll('#cellgame .chip.sel').forEach(function(x){x.classList.remove('sel')});
       c.classList.add('sel');selChip=o.id}
   });
   parts.appendChild(c);
 });
 board.appendChild(parts);
 ['Функція','Будова','Зображення'].forEach(function(secTitle,si){
   var col=document.createElement('div');col.className='col';
   col.innerHTML='<div class="sec-h">'+secTitle+'</div>';
   shuffle(ORG.slice()).forEach(function(o){
     var b=document.createElement('div');b.className='blk';b.dataset.org=o.id;
     var content = si===0?'<div class="txt">'+o.fn+'</div>': si===1?'<div class="txt">'+o.st+'</div>':'<div class="imgw">'+icon(o.id)+'</div>';
     b.innerHTML='<div class="slot">+ назва</div>'+content;
     b.addEventListener('dragover',function(e){e.preventDefault();if(!b.classList.contains('done'))b.classList.add('over')});
     b.addEventListener('dragleave',function(){b.classList.remove('over')});
     b.addEventListener('drop',function(e){e.preventDefault();b.classList.remove('over');attempt(e.dataTransfer.getData('text/plain'),b)});
     b.addEventListener('click',function(){if(selChip&&!b.classList.contains('done'))attempt(selChip,b)});
     col.appendChild(b);
   });
   board.appendChild(col);
 });
}
function attempt(orgId,blk){
 if(blk.classList.contains('done'))return;
 if(orgId===blk.dataset.org){
   blk.classList.add('done');
   blk.querySelector('.slot').innerHTML=CHECK+'<span>'+ORG.find(function(o){return o.id===orgId}).name+'</span>';
   var chip=board.querySelector('.chip[data-org="'+orgId+'"]');
   if(chip){chip.style.display='none'}
   document.querySelectorAll('#cellgame .chip.sel').forEach(function(x){x.classList.remove('sel')});selChip=null;
   matched++;scoreEl.textContent=matched+' / '+ORG.length;
   fill.style.width=(matched/ORG.length*100)+'%';
   if(matched===ORG.length)winEl.className='win show';
 }else{
   blk.classList.add('shake');
   var chip2=board.querySelector('.chip[data-org="'+orgId+'"]');
   if(chip2){chip2.classList.add('shake');setTimeout(function(){chip2.classList.remove('shake')},400)}
   setTimeout(function(){blk.classList.remove('shake')},400);
 }
}
document.getElementById('cgReset').addEventListener('click',build);
build();
})();
</script>
</div>
</body>
